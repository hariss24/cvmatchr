name: Index des boards français

on:
  schedule:
    # Lundi 03:00 UTC. Hebdomadaire : c'est l'index des boards, pas les offres —
    # une entreprise ne change pas d'ATS en une semaine.
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Même groupe que la boucle autonome : les deux workflows commitent sur `main`,
# et sans ce verrou partagé un push simultané échoue ou écrase.
concurrency:
  group: boucle-autonome
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    # Relevé à 180 le 05/08/2026, quand les PME de 50 à 199 salariés se sont
    # ajoutées : 49 438 entreprises de plus à énumérer puis à sonder. Puis à 300
    # le 06/08/2026 avec Workday, dont le premier passage a duré 1 h 30 sur
    # 2 467 vitrines. Un passage à froid est le pire cas ; ensuite le mémo en
    # épargne la majorité.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LOOP_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests des modules de l'index
        run: node --test "scripts/boards/*.test.mjs"

      - name: Rafraîchir l'index
        run: node scripts/build-boards-fr.mjs --source=tout

      # Workday à part : ses adresses ne se devinent pas depuis un nom
      # d'entreprise, elles se lisent dans l'index public de Common Crawl.
      # Voir scripts/boards/crawl.mjs. Le mémo mensuel fait que seuls les
      # locataires non testés du mois repassent — le premier passage à froid a
      # duré 1 h 30 sur 2 467 vitrines, les suivants sont bien plus courts.
      - name: Rafraîchir les boards Workday
        run: node scripts/build-boards-workday.mjs

      - name: Commiter si l'index a changé
        run: |
          if git diff --quiet -- web/src/lib/jobs/data/boards-fr.json web/src/lib/jobs/data/boards-fr-testes.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/jobs/data/boards-fr.json web/src/lib/jobs/data/boards-fr-testes.json
          git commit -m "chore(boards): rafraîchissement hebdomadaire de l'index"
          git pull --rebase
          git push
