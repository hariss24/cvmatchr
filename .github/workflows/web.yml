name: Web Next.js CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 24 et pas 22 : la lecture de l'index columnar de Common Crawl passe
          # par le décompresseur ZSTD de node:zlib (voir scripts/boards/parquet.mjs).
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Tests des scripts de la boucle
        working-directory: .
        run: node --test "boucle/bin/*.test.mjs"

      # Dépendances de scripts/ (hyparquet), distinctes de celles de web/.
      - name: Dépendances des scripts
        working-directory: .
        run: npm ci

      - name: Tests des scripts de l'index des boards
        working-directory: .
        run: node --test "scripts/boards/*.test.mjs"

      - name: Install dependencies
        run: npm ci

      - name: Check types (tsc)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit Tests (Vitest)
        run: npm run test

      - name: Build Next.js
        run: npm run build
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E Tests (Playwright)
        run: npm run test:e2e
        env:
          # Valeurs factices, jamais contactées : les parcours testés
          # s'arrêtent à la validation côté navigateur. Elles servent
          # uniquement à ce que `isConfigured` soit vrai et que la page de
          # connexion s'affiche au lieu de se déclarer indisponible.
          NEXT_PUBLIC_SUPABASE_URL: https://exemple-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-anonyme-factice-pour-la-ci
