name: Scan quotidien des offres

# Séparé de « Index des boards français » parce que les deux rythmes n'ont rien
# à voir : une entreprise ne change pas d'ATS en une semaine, mais une offre
# neuve perd sa valeur en quelques jours. Mesure du 04/08/2026 : âge médian des
# offres moissonnées 46 jours, seules 617 sur 9 719 à moins de 48 h. Voir un
# poste le jour de sa parution, c'est tout l'intérêt du dispositif.
on:
  schedule:
    # 06:00 UTC : après la fenêtre du job hebdomadaire (lundi 03:00 + 120 min max),
    # pour que les deux ne se disputent pas le verrou.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Même groupe que la boucle autonome et que l'index : tous commitent sur `main`,
# et sans ce verrou partagé un push simultané échoue ou écrase.
concurrency:
  group: boucle-autonome
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  offres:
    runs-on: ubuntu-latest
    # Relevé de 60 à 150 le 06/08/2026 : Workday a porté l'index de 503 à 864
    # boards, et ses gros boards s'ouvrent offre par offre pour lire le pays.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.LOOP_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests des modules de l'index
        run: node --test "scripts/boards/*.test.mjs"

      - name: Moissonner les offres légères
        run: node scripts/build-boards-offres.mjs

      # ⚠️ `always()` : quand la moisson déclare l'échec (trop de boards
      # injoignables), elle a QUAND MÊME écrit ce qu'elle a pu ramener. On
      # commite ce résultat partiel, puis le job reste rouge et `alerte.yml`
      # ouvre l'issue. Sans cela, un incident ferait perdre la moisson du jour
      # en plus de la signaler.
      - name: Commiter si les offres ont changé
        if: always()
        run: |
          # ⚠️ `boards-geo.json` est commité avec l'index : chaque exécution part
          # d'un runner vierge, et sans ce cache les 2 918 libellés de lieu
          # seraient redemandés à la Base Adresse Nationale tous les matins.
          if git diff --quiet -- web/src/lib/jobs/data/boards-offres.json web/src/lib/jobs/data/boards-geo.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/src/lib/jobs/data/boards-offres.json web/src/lib/jobs/data/boards-geo.json
          git commit -m "chore(boards): scan quotidien des offres"
          git pull --rebase
          git push
