name: Boucle autonome

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      role:
        description: "Forcer un rôle (vide = choix automatique)"
        required: false
        default: ""

concurrency:
  group: boucle-autonome
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Exigée par `claude-code-action` pour l'échange OIDC qui authentifie le jeton
  # d'abonnement. Sans elle : « Could not fetch an OIDC token », après trois tentatives.
  id-token: write

jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.LOOP_GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Tests des scripts de la boucle
        run: node --test "boucle/bin/*.test.mjs"

      # AVANT « Branche de travail », qui rebase : sans identité, `git rebase` meurt sur
      # « empty ident name ». Configurée plus bas, elle a fait passer tout rebase pour un
      # conflit avec le propriétaire — la boucle a fermé sa propre PR et jeté son travail
      # (PR #13, réveil du 01/08 21:15).
      - name: Identité des commits de la boucle
        run: |
          git config user.name "Boucle CVMatchr"
          git config user.email "boucle@cvmatchr.local"

      # PR ouverte de la boucle, s'il y en a une : le réveil poursuit dessus plutôt que
      # d'en ouvrir une seconde. Le rôle, lui, ne dépend plus de son état — la boucle
      # n'écrit que des documents, une CI rouge ne peut plus venir d'elle.
      - name: PR ouverte de la boucle
        id: pr
        env:
          GH_TOKEN: ${{ secrets.LOOP_GITHUB_TOKEN }}
        run: |
          numero=$(gh pr list --state open --limit 1 --json number,headRefName \
                     --jq '[.[] | select(.headRefName | startswith("claude/"))] | .[0].number // empty')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          [ -z "$numero" ] && echo "Aucune PR de la boucle ouverte." || echo "PR courante : #$numero"

      - name: Choix du rôle
        id: role
        run: |
          if [ -n "${{ github.event.inputs.role }}" ]; then
            echo "role=${{ github.event.inputs.role }}" >> "$GITHUB_OUTPUT"
          else
            node boucle/bin/choisir-role.mjs >> "$GITHUB_OUTPUT"
          fi

      - name: Mandat du rôle
        id: mandat
        if: steps.role.outputs.role != 'Pause'
        run: |
          case "${{ steps.role.outputs.role }}" in
            "Éclaireur") echo "fichier=boucle/roles/eclaireur.md" >> "$GITHUB_OUTPUT" ;;
            "Arbitre")   echo "fichier=boucle/roles/arbitre.md" >> "$GITHUB_OUTPUT" ;;
            *) echo "Rôle inconnu : ${{ steps.role.outputs.role }}" && exit 1 ;;
          esac

      - name: Branche de travail
        id: branche
        if: steps.role.outputs.role != 'Pause'
        run: |
          if [ -n "${{ steps.pr.outputs.numero }}" ]; then
            nom=$(gh pr view ${{ steps.pr.outputs.numero }} --json headRefName --jq .headRefName)
            git checkout "$nom"
            # Le propriétaire gagne toujours : on se rebase sur son travail. En cas de
            # conflit on abandonne la branche au lieu de forcer quoi que ce soit — le
            # chantier repartira du backlog, aucun travail humain n'est écrasé.
            #
            # Mais on n'abandonne QUE pour un vrai conflit. Un `git rebase` peut aussi
            # échouer pour des raisons qui n'ont rien à voir avec le travail en cours
            # (identité absente, dépôt en mauvais état) : traiter ces pannes comme un
            # conflit revenait à détruire un chantier entier à cause d'un outil mal
            # configuré. C'est arrivé pour de vrai le 01/08 (PR #13).
            if ! git rebase origin/main; then
              conflits=$(git diff --name-only --diff-filter=U)
              git rebase --abort || true
              if [ -z "$conflits" ]; then
                echo "::error::Le rebase a échoué SANS conflit de fichier — panne d'outil,"
                echo "::error::pas désaccord avec le propriétaire. La branche est conservée."
                exit 1
              fi
              gh pr close "${{ steps.pr.outputs.numero }}" \
                --comment "Conflit avec main après un changement du propriétaire, sur : $conflits

            Branche abandonnée, le chantier retourne au backlog."
              nom="claude/reveil-$(date -u +%Y%m%d-%H%M)"
              git checkout origin/main -B "$nom"
            fi
          else
            nom="claude/reveil-$(date -u +%Y%m%d-%H%M)"
            git checkout -b "$nom"
          fi
          echo "nom=$nom" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.LOOP_GITHUB_TOKEN }}

      # `npm ci` a disparu : la boucle n'exécute plus l'application, elle l'observe et
      # écrit des documents. Un Éclaireur qui a besoin de mesurer quelque chose sur le
      # produit installe ce qu'il lui faut lui-même, dans son réveil.

      - name: Réveil de Claude
        if: steps.role.outputs.role != 'Pause'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Sans cette ligne, l'action applique sa liste d'outils par défaut : le premier
          # réveil réel a tourné 39 tours pour 15 refus de permission et zéro fichier
          # écrit. L'agent est délibérément permissif ici — ce n'est pas lui qui contient
          # la boucle, c'est `verifier-perimetre.mjs`, qui inspecte son diff juste après.
          claude_args: "--allowedTools Read,Glob,Grep,Write,Edit,Bash,WebFetch,WebSearch,TodoWrite"
          # Sans ça, le journal ne montre pas ce que l'agent a fait : impossible de
          # diagnostiquer un réveil qui « réussit » en ne produisant rien.
          show_full_output: true
          prompt: |
            Tu es réveillé pour jouer le rôle « ${{ steps.role.outputs.role }} » de la
            boucle autonome de CVMatchr.

            Lis dans cet ordre, en entier :
            1. boucle/MISSION.md
            2. boucle/ETAT.md
            3. boucle/IDEES.md
            4. ${{ steps.mandat.outputs.fichier }}

            Applique ton mandat à la lettre. Ne lis jamais tout le dépôt : uniquement
            les fichiers dont ton mandat a besoin.

            TU N'IMPLÉMENTES RIEN. La boucle propose, le propriétaire décide et
            construit. Tu n'écris que dans `boucle/` et `docs/`. Toucher à `web/` ou
            `extension/`, même pour une correction évidente, fait refuser ton diff par
            `boucle/bin/verifier-perimetre.mjs` et perd tout ton réveil. Si tu vois
            quelque chose à corriger, écris-le, ne le corrige pas.

            IMPÉRATIF — enregistre ton travail avant de terminer :

                git add -A
                git commit -m "<ce que tu as fait, en français>"

            Un fichier écrit et non commité est PERDU : cette machine est détruite à la
            fin du réveil. Ne termine jamais sans avoir vérifié `git status`.

            En revanche tu ne pousses pas, tu n'ouvres pas de PR, tu ne fusionnes rien :
            le workflow s'en charge après avoir vérifié ton périmètre.

      # Filet de sécurité : le moteur ne voit que les commits, or rien ne garantit que
      # l'agent commite ce qu'il écrit. Deux réveils réels ont produit 39 puis 63 tours
      # de travail perdus faute de commit. On ne compte donc pas sur sa discipline : ce
      # qui traîne dans l'arbre de travail est enregistré ici, et passera comme le reste
      # sous le garde-fou de l'étape suivante.
      - name: Enregistrer ce que l'agent a laissé en plan
        if: steps.role.outputs.role != 'Pause'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::L'agent n'a pas commité son travail — le moteur s'en charge."
            git status --short
            git add -A
            git commit -m "${{ steps.role.outputs.role }} : travail enregistré par le moteur

          L'agent a écrit ces fichiers sans les commiter."
          else
            echo "Rien à rattraper : l'agent a commité son travail lui-même."
          fi

      # Le garde-fou passe APRÈS Claude et AVANT le push : une violation ne quitte
      # jamais le runner.
      - name: Vérification du périmètre
        if: steps.role.outputs.role != 'Pause'
        run: git diff --name-only origin/main...HEAD | node boucle/bin/verifier-perimetre.mjs

      - name: Y a-t-il quelque chose à pousser ?
        id: travail
        if: steps.role.outputs.role != 'Pause'
        run: |
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "rien=oui" >> "$GITHUB_OUTPUT"
          else
            echo "rien=non" >> "$GITHUB_OUTPUT"
          fi

      # `claude-code-action` réécrit les accès git du dépôt pour ses propres commits, et
      # révoque son jeton en fin d'étape : ceux posés par `checkout` ne survivent pas
      # (« Invalid username or token » au push). On les réinstalle explicitement ici.
      - name: Push
        if: steps.role.outputs.role != 'Pause' && steps.travail.outputs.rien == 'non'
        env:
          JETON: ${{ secrets.LOOP_GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${JETON}@github.com/${{ github.repository }}.git"
          git push --set-upstream origin "${{ steps.branche.outputs.nom }}"

      - name: Ouverture ou mise à jour de la PR
        if: steps.role.outputs.role != 'Pause' && steps.travail.outputs.rien == 'non'
        env:
          GH_TOKEN: ${{ secrets.LOOP_GITHUB_TOKEN }}
        run: |
          if [ -z "${{ steps.pr.outputs.numero }}" ]; then
            gh pr create \
              --base main \
              --head "${{ steps.branche.outputs.nom }}" \
              --title "Boucle — ${{ steps.role.outputs.role }} du $(date -u +%d/%m/%Y)" \
              --body "Réveil automatique. Rôle joué : ${{ steps.role.outputs.role }}.

          **Aucun code applicatif** : la boucle propose, le propriétaire décide.
          Le classement des idées est dans \`boucle/IDEES.md\`, le compte rendu dans
          \`boucle/journal/\`.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          fi

      # `--auto` confie la fusion à GitHub : elle n'aura lieu que lorsque les
      # vérifications EXIGÉES par la protection de branche seront vertes. Sans cette
      # protection (Task 6), GitHub fusionnerait immédiatement.
      - name: Demande de fusion automatique
        if: steps.role.outputs.role != 'Pause' && steps.travail.outputs.rien == 'non'
        env:
          GH_TOKEN: ${{ secrets.LOOP_GITHUB_TOKEN }}
        run: |
          numero="${{ steps.pr.outputs.numero }}"
          [ -z "$numero" ] && numero=$(gh pr view --json number --jq .number)

          # `--auto` ne diffère la fusion que si GitHub refuse déjà de fusionner. Sans
          # protection, il fusionne immédiatement, avant même que la CI ait répondu — la
          # boucle enverrait du code non testé en production.
          #
          # On ne demande pas à GitHub « une règle existe-t-elle ? » : lire la
          # configuration d'administration exige une permission que la boucle n'a pas, et
          # un refus silencieux se lisait comme une absence de règle. On lui demande la
          # seule chose qui compte et qui est visible d'ici : « refuses-tu de fusionner
          # CETTE proposition, maintenant ? ». BLOCKED = la porte est fermée.
          etat="UNKNOWN"
          for _ in 1 2 3 4 5 6; do
            etat=$(gh pr view "$numero" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$etat" != "UNKNOWN" ] && break
            sleep 10
          done

          if [ "$etat" != "BLOCKED" ]; then
            echo "::warning::Fusion automatique NON armée : GitHub ne bloque pas la PR #$numero"
            echo "::warning::(état « $etat »). La protection de main est absente ou inopérante."
            echo "La PR reste ouverte et attend une fusion manuelle."
            exit 0
          fi

          if [ "$(gh pr view "$numero" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "PR en brouillon : pas de fusion automatique."
          else
            gh pr merge "$numero" --auto --squash
          fi

      - name: Compte rendu
        if: always()
        run: |
          echo "Rôle : ${{ steps.role.outputs.role }}"
          echo "Branche : ${{ steps.branche.outputs.nom }}"
          echo "PR : ${{ steps.pr.outputs.numero }}"
